<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: rgb(45, 247, 5);
      font-family: Arial, Helvetica, sans-serif;
      color: aliceblue;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #container {
      background-color: rgb(255, 145, 2);
      padding: 30px;
      text-align: center;
      border-radius: 12px;
    }
    h1 {
      padding: 20px;
    }
    input {
      display: block;
      padding: 10px 100px;
      margin: 10px;
      font-size: 18px;
      border: none;
      text-align: justify;
    }
    input:focus {
      border: none;
      outline: none;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      background-color: blueviolet;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      color: aliceblue;
    }
    button:hover {
      background-color: rgb(126, 0, 243);
    }
    #quoteDisplay {
      background-color: aliceblue;
      height: 100px;
      border-radius: 10px;
      outline: 3px solid rgb(71, 0, 104);
      color: black;
      text-align: center;
      padding-top: 10px;
      margin-bottom: 15px;
    }
    button:active {
      background-color: rgb(150, 44, 248);
    }
    /* Container styling */
#categoryFilter {
  padding: 8px 12px;
  font-size: 16px;
  border: 2px solid #6c63ff;
  border-radius: 8px;
  background-color: #fff;
  color: #333;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-left: 10px;
}

/* Hover and focus effects */
#categoryFilter:hover,
#categoryFilter:focus {
  border-color: #4b47cc;
  box-shadow: 0 0 8px rgba(108, 99, 255, 0.4);
  outline: none;
}

/* Label styling */
label[for="categoryFilter"] {
  font-weight: bold;
  color: #444;
  font-size: 16px;
}

label[for="categoryFilter"] {
  margin-right: 8px;
}

  </style>
</head>
<body>
  <div id="container">
    <h1>Dynamic Quote Generator</h1>
    <div id="quoteDisplay"></div>
    <button id="newQuote">Show New Quote</button>

    <!-- Export Quotes Button -->
    <button id="exportQuotesBtn">Export Quotes</button>

    <!-- Import Quotes Button -->
    <input type="file" id="importJson" accept="application/json">

    
    <label for="categoryFilter">Filter by Category: </label>
<select id="categoryFilter" onchange="filterQuotes()">
  <option value="all">All Categories</option>
</select>

  </div>


  <script src="script.js"></script>
</body>
</html>
